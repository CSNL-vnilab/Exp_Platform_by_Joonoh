name: Reminders cron (manual)
on:
  # Scheduled firing moved to Vercel Cron (vercel.json → /api/notifications/reminders)
  # 2026-05-29 — GitHub Actions free-tier cron was firing every 2-4h instead of
  # the declared 15 min, causing day-of 09:00 KST reminders to slip into the
  # afternoon. Manual-trigger only here so the workflow remains available for
  # debugging without racing the Vercel-cron path (processReminders has no
  # advisory lock against concurrent dispatchers).
  workflow_dispatch:

jobs:
  ping-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          REMINDER_URL: https://lab-reservation-seven.vercel.app/api/notifications/reminders
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is missing — add it at Settings → Secrets → Actions"
            exit 1
          fi
          # Print length only (never the secret itself). Expected 64 for hex32.
          echo "secret_length=${#CRON_SECRET}"
          status=$(curl -sS -o /tmp/resp -w "%{http_code}" \
            -X POST "$REMINDER_URL" \
            -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $status"
          echo "--- response body ---"
          cat /tmp/resp || true
          echo
          echo "--- /end ---"
          if [ "$status" != "200" ]; then
            echo "::error::reminders endpoint returned HTTP $status"
            exit 1
          fi
