name: Reminders cron
on:
  # 15-min cadence (UTC). NB: Vercel Hobby tier rejects any cron more
  # frequent than daily, so the dispatcher stays on GitHub Actions. Free
  # public-repo cron events get throttled to roughly every 1-4h under
  # load — see docs/cron-runbook.md §6 for context. Mitigations: each
  # cron run sweeps all overdue reminders in one pass (processReminders
  # uses scheduled_at <= now), and the workflow_dispatch trigger below
  # is the manual-catch-up escape hatch.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          REMINDER_URL: https://lab-reservation-seven.vercel.app/api/notifications/reminders
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is missing — add it at Settings → Secrets → Actions"
            exit 1
          fi
          # Print length only (never the secret itself). Expected 64 for hex32.
          echo "secret_length=${#CRON_SECRET}"
          status=$(curl -sS -o /tmp/resp -w "%{http_code}" \
            -X POST "$REMINDER_URL" \
            -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $status"
          echo "--- response body ---"
          cat /tmp/resp || true
          echo
          echo "--- /end ---"
          if [ "$status" != "200" ]; then
            echo "::error::reminders endpoint returned HTTP $status"
            exit 1
          fi
      - uses: ./.github/actions/notify-cron-failure
        if: failure()
        with:
          cron-name: "Reminders cron (every 15 min)"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
